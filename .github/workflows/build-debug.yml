name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.6
        with:
          submodules: 'true'

      - name: set up JDK 17
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create dummy keystore.properties
        run: |
          echo "keyAlias=androiddebugkey" > keystore.properties
          echo "keyPassword=android" >> keystore.properties
          echo "storeFile=debug.keystore" >> keystore.properties
          echo "storePassword=android" >> keystore.properties

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore app/debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Debug,O=Debug,C=US"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List available assemble tasks (debug)
        run: ./gradlew tasks --all | grep -i assemble

      - name: Build with Gradle
        run: ./gradlew assembleEmulatorDebug

      - name: List generated APKs (debug)
        run: find . -name "*.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "JL-Mod-debug"
          path: app/build/outputs/apk/emulator/debug/*-universal.apk
          if-no-files-found: error
